<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>取件码对照表 · J3K 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#4a3b39; --ink-2:#8a7461; --gold:#cf9a4c; --gold-l:#f1d9a6;
    --paper:#fffaf1; --line:rgba(207,154,76,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    background:linear-gradient(170deg,#fff3e4 0%,#fbd2a8 38%,#e99a9e 72%,#a06382 100%);
    background-attachment:fixed;
    padding:clamp(16px,4vw,40px) clamp(12px,3vw,28px) 60px;
  }
  .wrap{max-width:760px;margin:0 auto}
  header{margin-bottom:18px}
  h1{
    font-family:"Noto Serif SC",serif;font-weight:900;letter-spacing:.06em;
    font-size:clamp(24px,6vw,34px);margin:0 0 6px;color:#7a2b28;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  .sub{margin:0;font-size:13.5px;color:#7d5a56}
  .sub b{color:#7a2b28}
  .bar{
    display:flex;gap:10px;margin:16px 0 14px;flex-wrap:wrap;
  }
  .q{
    flex:1 1 220px;min-width:0;
    padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,252,246,.92);font-size:15px;font-family:inherit;color:var(--ink);
    box-shadow:0 6px 16px -12px rgba(74,42,58,.5);
  }
  .q:focus{outline:2px solid rgba(207,154,76,.55);outline-offset:1px}
  .btn{
    padding:12px 16px;border-radius:12px;border:1px solid var(--line);cursor:pointer;
    background:linear-gradient(180deg,#fff6e2,#f3dcab);color:#6b4a2a;
    font-family:inherit;font-size:14px;font-weight:500;
    box-shadow:0 6px 14px -10px rgba(74,42,58,.6);
  }
  .btn:active{transform:translateY(1px)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:#7d5a56;margin:0 0 16px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}

  table{width:100%;border-collapse:separate;border-spacing:0 8px}
  thead th{
    font-size:12px;font-weight:500;color:#7d5a56;text-align:left;
    padding:0 12px 2px;letter-spacing:.06em;
  }
  thead th:last-child{text-align:right}
  tbody tr{
    background:rgba(255,252,246,.95);
    box-shadow:0 8px 20px -16px rgba(74,42,58,.75), inset 0 0 0 1px rgba(207,154,76,.28);
  }
  tbody td{padding:11px 12px;vertical-align:middle}
  tbody tr td:first-child{border-radius:12px 0 0 12px}
  tbody tr td:last-child{border-radius:0 12px 12px 0;text-align:right;white-space:nowrap}
  .nm{font-family:"Noto Serif SC",serif;font-size:16px;font-weight:600;line-height:1.25}
  .nm .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
  .nm .bear{font-size:13px;margin-left:4px;opacity:.85}
  .sb{display:block;font-size:12px;color:var(--ink-2);margin-top:3px;font-weight:400}
  .code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:clamp(17px,4.4vw,20px);font-weight:700;letter-spacing:.1em;color:#7a2b28;
    cursor:pointer;user-select:all;
  }
  .code:active{opacity:.6}
  .go{
    display:inline-block;text-decoration:none;font-size:13px;color:#6b4a2a;
    padding:7px 11px;border-radius:9px;border:1px solid var(--line);
    background:linear-gradient(180deg,#fff6e2,#f3dcab);
  }
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    background:rgba(60,36,34,.92);color:#fff8ec;font-size:13.5px;
    padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .empty{padding:28px;text-align:center;color:#7d5a56;font-size:14px}
  footer{margin-top:26px;font-size:12px;color:#6d4d4a;line-height:1.7}
  footer a{color:#6d4d4a}

  @media (max-width:520px){
    thead{display:none}
    tbody tr{display:block;position:relative;margin-bottom:10px}
    tbody td{display:block;padding:4px 12px;border-radius:0!important}
    tbody tr td:first-child{border-radius:12px 12px 0 0!important;padding-top:11px;padding-right:84px}
    tbody tr td:nth-child(2){padding-bottom:13px}
    tbody tr td:last-child{position:absolute;top:12px;right:12px;padding:0}
    .code{font-size:20px}
    .go{font-size:12.5px;padding:6px 9px}
  }
  /* ---- 密码门 ---- */
  .gate{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(170deg,#fff3e4 0%,#fbd2a8 40%,#e99a9e 75%,#a06382 100%);
    padding:24px;
    transition:opacity .35s ease, visibility .35s;
  }
  .gate.hide{opacity:0; visibility:hidden; pointer-events:none}
  .gate-card{
    width:100%; max-width:330px; background:rgba(255,252,246,.97);
    border-radius:18px; padding:26px 22px 22px; text-align:center;
    box-shadow:0 22px 48px -26px rgba(74,42,58,.75), inset 0 0 0 1px rgba(207,154,76,.35);
  }
  .gate-card h2{
    font-family:"Noto Serif SC",serif; font-size:20px; font-weight:900;
    color:#7a2b28; margin:0 0 6px; letter-spacing:.08em;
  }
  .gate-card p.tip{margin:0 0 18px; font-size:12.5px; color:#8a6a66}
  .gate-in{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:#fff; font-size:20px; letter-spacing:.35em; text-align:center;
    font-family:ui-monospace,Menlo,Consolas,monospace; color:#7a2b28; font-weight:700;
  }
  .gate-in:focus{outline:2px solid rgba(207,154,76,.6); outline-offset:1px}
  .gate-btn{
    width:100%; margin-top:12px; padding:13px; border-radius:12px; cursor:pointer;
    border:1px solid rgba(160,110,50,.35);
    background:linear-gradient(180deg,#f7dfa5,#d8a652); color:#5a3a1c;
    font-family:inherit; font-size:15px; font-weight:700; letter-spacing:.1em;
    box-shadow:0 10px 20px -14px rgba(74,42,58,.9);
  }
  .gate-btn:active{transform:translateY(1px)}
  .gate-err{min-height:18px; margin:10px 0 0; font-size:12.5px; color:#b3261e}
  .shake{animation:shake .32s}
  @keyframes shake{
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
    50%{transform:translateX(6px)} 80%{transform:translateX(-3px)}
  }
  @media print{
    .gate{display:none}
    body{background:#fff;color:#000;padding:0}
    .bar,.legend,.go,footer{display:none}
    tbody tr{box-shadow:none;border-bottom:1px solid #ddd}
    .code{color:#000}
  }
</style>
</head>

    <h2>取件码对照表</h2>
    <p class="tip">内部使用 ｜ 请输入密码</p>

</div>

<div class="wrap">

  <table>
    <thead>
      <tr><th>老师</th><th>取件码</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <footer>
    专属链接格式：<code>index.html?code=取件码</code>（点开自动开箱）。<br>
    线上地址：<code>https://gausan-hj.github.io/j3k-2026/</code>
  </footer>
</div>
<div class="toast" id="toast"></div>

var PW_HASH = "7c537f06";
var T = [];
var rowsEl = document.getElementById('rows');
var qEl = document.getElementById('q');
var toastEl = document.getElementById('toast');

function hashPw(s){
  var v = 5381, bytes = new TextEncoder().encode(s);
  for(var i = 0; i < bytes.length; i++) v = ((v * 33) ^ bytes[i]) >>> 0;
  return v.toString(16);
}

function b64decode(str){
  var bin = atob(str), bytes = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function unlock(){
  T = JSON.parse(b64decode(DATA_B64));
  document.getElementById('count').textContent = T.length;
  render(T);
  document.getElementById('gate').classList.add('hide');
  try { sessionStorage.setItem('j3k_code_ok', '1'); } catch(e){}
}

document.getElementById('gateForm').addEventListener('submit', function(e){
  e.preventDefault();
  var pw = document.getElementById('pw').value.trim();
  var err = document.getElementById('gateErr');
  if(hashPw(pw) === PW_HASH){
    err.textContent = '';
    unlock();
  } else {
    err.textContent = '密码不对，再试一次';
    var card = document.querySelector('.gate-card');
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    document.getElementById('pw').select();
  }
});

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ toastEl.classList.remove('on'); }, 1400);
}

function copy(text, msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(msg); }, function(){ fallback(text, msg); });
  } else {
    fallback(text, msg);
  }
}
function fallback(text, msg){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(msg); } catch(e){ toast('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}

function render(list){
  if(!list.length){
    rowsEl.innerHTML = '<tr><td colspan="3" class="empty">没有匹配的老师</td></tr>';
    return;
  }
  var h = '';
  list.forEach(function(t){
    h += '<tr>' +
      '<td><span class="nm"><i class="dot" style="background:' + t.hex + '"></i>' + esc(t.name) +
        (t.bear ? '<span class="bear" title="箱里有 3D 小熊">🧸</span>' : '') +
        '</span><span class="sb">' + esc(t.subject) + ' ｜ ' + esc(t.rose) + '</span></td>' +
      '<td><span class="code" data-code="' + esc(t.code) + '">' + esc(t.code) + '</span></td>' +
      '<td><a class="go" href="index.html?code=' + encodeURIComponent(t.code) + '">打开 →</a></td>' +
    '</tr>';
  });
  rowsEl.innerHTML = h;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
  });
}

rowsEl.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('.code') : null;
  if(el){ copy(el.getAttribute('data-code'), '已复制 ' + el.getAttribute('data-code')); }
});

document.getElementById('copyAll').addEventListener('click', function(){
  var txt = T.map(function(t){ return t.name + '\t' + t.code; }).join('\n');
  copy(txt, '已复制全部 ' + T.length + ' 位老师的名单');
});

qEl.addEventListener('input', function(){
  var k = qEl.value.trim().toLowerCase();
  if(!k){ render(T); return; }
  render(T.filter(function(t){
    return (t.name + ' ' + t.subject + ' ' + t.code + ' ' + t.rose).toLowerCase().indexOf(k) >= 0;
  }));
});
